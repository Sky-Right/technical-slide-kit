<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-labelledby="title desc">
  <title id="title">Markdown to a portable presentation</title>
  <desc id="desc">Write Markdown, build locally, and open the resulting HTML file.</desc>
  <style>text{font-family:ui-monospace,Consolas,monospace;font-size:27px;fill:#182230}.sub{font-family:Arial,sans-serif;font-size:21px;fill:#566479}.box{fill:#fff;stroke:#c8d1dd;stroke-width:2}.arrow{fill:none;stroke:#087f8c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
  <rect class="box" x="1" y="20" width="250" height="130" rx="4"/>
  <rect class="box" x="375" y="20" width="250" height="130" rx="4"/>
  <rect class="box" x="749" y="20" width="250" height="130" rx="4"/>
  <text x="126" y="76" text-anchor="middle">slides.md</text><text class="sub" x="126" y="113" text-anchor="middle">Write</text>
  <text x="500" y="76" text-anchor="middle">build.py</text><text class="sub" x="500" y="113" text-anchor="middle">Bundle locally</text>
  <text x="874" y="76" text-anchor="middle">index.html</text><text class="sub" x="874" y="113" text-anchor="middle">Present anywhere</text>
