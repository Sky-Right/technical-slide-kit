<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">A request through three components</title>
  <desc id="desc">The browser sends a request to the API. The API queries the database and returns a response.</desc>
  <style>text{font-family:Arial,sans-serif;font-size:28px;fill:#182230}.label{font-family:ui-monospace,Consolas,monospace;font-size:22px;fill:#566479}.box{fill:#fff;stroke:#c8d1dd;stroke-width:2}.arrow{fill:none;stroke:#087f8c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.return{stroke:#6654c0}</style>
  <rect class="box" x="1" y="110" width="230" height="100" rx="4"/>
  <rect class="box" x="385" y="110" width="230" height="100" rx="4"/>
  <rect class="box" x="769" y="110" width="230" height="100" rx="4"/>
  <text x="116" y="170" text-anchor="middle">Browser</text>
  <text x="500" y="170" text-anchor="middle">API</text>
  <text x="884" y="170" text-anchor="middle">Database</text>
  <text class="label" x="308" y="74" text-anchor="middle">request</text>
  <text class="label" x="692" y="74" text-anchor="middle">query</text>
  <path class="arrow" d="M245 130H371M361 121L371 130 361 139M629 130H755M745 121L755 130 745 139"/>
  <path class="arrow return" d="M371 190H245M255 181L245 190 255 199M755 190H629M639 181L629 190 639 199"/>
  <text class="label" x="308" y="252" text-anchor="middle">response</text>
  <text class="label" x="692" y="252" text-anchor="middle">result</text>
</svg>
